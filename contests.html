<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The board — Katy Golf League</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#007041">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#007041;--green-deep:#00522F;--lime:#B8EB7A;
  --field:#DCE1DC;--card:#FFFFFF;--ink:#10221A;--dim:#5F6F66;--rule:#D2D8D2;
  --warn:#B91C1C;--gold:#B8860B;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --data:'Martian Mono','Courier New',monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--field);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:96px;-webkit-tap-highlight-color:transparent}
h1,h2{margin:0;font-family:var(--display);font-weight:800;line-height:1}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.shell{max-width:560px;margin:0 auto}

.top{background:var(--green);color:#fff;padding:15px 16px 17px}
.crumb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);
  font-weight:600}
.top h1{font-size:26px;margin-top:10px}
.top p{margin:9px 0 0;font-size:13px;color:rgba(255,255,255,.75);line-height:1.5}

/* ---------- a contest ---------- */
.contest{background:var(--card);margin-top:1px;padding:16px}
.chead{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.chead h2{font-size:19px}
.chead .hole{font-family:var(--data);font-size:10px;letter-spacing:.09em;
  background:var(--green);color:#fff;padding:4px 8px}
.chead .pot{margin-left:auto;font-family:var(--data);font-size:14px;font-weight:600;
  color:var(--gold)}
.chead .pot span{font-size:9px;letter-spacing:.1em;color:var(--dim);
  display:block;text-align:right;font-weight:400}
.hint2{font-size:12px;color:var(--dim);margin:0 0 13px;line-height:1.45}

/* the board itself */
.board2{border:1px solid var(--rule);margin-bottom:13px}
.mark{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;
  align-items:center;padding:11px 12px;border-bottom:1px solid var(--rule);
  background:#FBFCFB}
.mark:last-child{border-bottom:0}
.mark.lead{background:#F3F9F1;border-left:4px solid var(--green);padding-left:8px}
.mark.mine{box-shadow:inset 0 0 0 1px var(--ink)}
.mark .rk{font-family:var(--data);font-size:12px;color:var(--dim);text-align:center}
.mark .nm2{min-width:0}
.mark .nm2 b{display:block;font-size:15px;line-height:1.2}
.mark .nm2 span{font-size:11px;color:var(--dim)}
.mark .val{font-family:var(--data);font-size:19px;font-weight:600;letter-spacing:-.03em}
.mark .tag2{font-family:var(--data);font-size:8px;letter-spacing:.08em;padding:3px 6px}
.tag-ok{background:var(--green);color:#fff}
.tag-new{background:#FDF3E7;color:#8A5A16}
.empty4{padding:18px 12px;font-size:13px;color:var(--dim);text-align:center}

/* in the pot, or not */
.entry{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:13px;
  font-size:13px;line-height:1.45}
.entry b{display:block}
.entry.in{background:#F3F9F1;border-left:4px solid var(--green)}
.entry.pending{background:#FDF3E7;border-left:4px solid #B45309;color:#7A4A10}
.entry.out{background:#F2F4F2;border-left:4px solid var(--rule)}
.entry > div{flex:1;min-width:0}
.entry button{background:var(--green);color:#fff;border:0;padding:10px 16px;
  font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.entry.pending button{background:none;color:#8A5A16;padding:0;margin-top:5px;
  font-size:12px;text-decoration:underline;text-underline-offset:3px;font-weight:400}
.none2{font-size:13px;color:var(--dim);margin:0;padding:10px 0}

/* posting */
.post2{border-top:1px dashed var(--rule);padding-top:13px}
.post2 > button{background:#FBFCFB;border:1px solid var(--rule);padding:11px 15px;
  cursor:pointer;font-size:14px;width:100%}
.post2 > button:hover{border-color:var(--green);color:var(--green)}
.form2{display:none;margin-top:12px}
.form2.on{display:block}
.who2{display:grid;gap:5px;margin-bottom:11px;max-height:230px;overflow-y:auto}
.who2 button{background:#FBFCFB;border:1px solid var(--rule);padding:11px 13px;
  text-align:left;cursor:pointer;font-size:15px;color:var(--ink);
  display:flex;align-items:center;gap:10px}
.who2 button i{width:4px;height:19px;background:var(--c);flex:none;display:block}
.who2 button span{color:var(--dim);font-size:12px;margin-left:auto}
.who2 button[aria-pressed="true"]{border-color:var(--ink);background:#fff;
  box-shadow:inset 0 0 0 1px var(--ink)}
.row3{display:flex;gap:9px;align-items:flex-end}
.row3 .fld{flex:1}
.row3 label{display:block;font-family:var(--data);font-size:8px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.row3 input{width:100%;font-family:var(--data);font-size:19px;padding:11px;
  border:1px solid var(--rule);background:#FBFCFB;text-align:center}
.row3 input:focus{outline:none;border-color:var(--green);background:#fff}
.row3 select{font-family:inherit;font-size:15px;padding:12px 10px;
  border:1px solid var(--rule);background:#FBFCFB}
.row3 .save{background:var(--green);color:#fff;border:0;padding:13px 18px;
  font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.row3 .save[disabled]{opacity:.4;cursor:default}
.msg3{font-size:12px;color:var(--dim);margin-top:8px}
.msg3.err{color:var(--warn)}

/* the buzz */
.buzz{position:fixed;left:12px;right:12px;bottom:88px;z-index:40;
  background:var(--ink);color:#fff;padding:14px 16px;
  display:none;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
.buzz.on{display:flex;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.buzz i{width:5px;align-self:stretch;background:var(--warn);flex:none}
.buzz .t2{flex:1;font-size:14px;line-height:1.4}
.buzz .t2 b{display:block}
.buzz button{background:none;border:0;color:rgba(255,255,255,.6);cursor:pointer;
  font-size:18px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.buzz.on{animation:none}}

.foot3{position:fixed;left:0;right:0;bottom:0;background:var(--green-deep);color:#fff;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot3 .shell{display:flex;align-items:center;gap:12px}
.foot3 .t{flex:1;font-size:12px;color:rgba(255,255,255,.62);line-height:1.35}
.foot3 a{background:var(--lime);color:var(--green-deep);text-decoration:none;
  padding:11px 16px;font-size:14px;font-weight:600;white-space:nowrap}
.foot3 button.bell{background:none;border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:10px 13px;font-size:13px;cursor:pointer;white-space:nowrap}

.state2{padding:50px 20px;text-align:center;color:var(--dim)}
.state2 b{display:block;color:var(--ink);font-size:19px;font-family:var(--display);
  font-weight:800;margin-bottom:8px}
</style>
</head>
<body>

<div class="shell">
  <div id="loading" class="state2"><p>Loading the board…</p></div>
  <div id="app" hidden></div>
</div>

<div class="buzz" id="buzz">
  <i></i>
  <div class="t2" id="buzztext"></div>
  <button type="button" id="buzzclose" aria-label="Dismiss">✕</button>
</div>

<script type="module">
import { supabase, requireAuth, me } from './assets/db.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const params = new URLSearchParams(location.search);
let profile, match, settings = {}, players = [], board = [], pots = {}, entrants = [];

const KINDS = {
  ctp:       { label: 'Closest to the pin', unit: true,  better: 'closest' },
  long_putt: { label: 'Long putt',          unit: true,  better: 'longest' },
  chip_in:   { label: 'Chip-ins',           unit: false, better: null }
};

/* ------------------------------------------------------------ */
(async () => {
  const session = await requireAuth();
  if (!session) return;

  profile = await me();
  if (!profile)         return fail('Could not load your profile.');
  if (!profile.team_id) return fail('You\u2019re not on a team yet.');

  const id = params.get('match');
  if (!id) return pickMatch();
  await load(id);
})();

function fail(msg) {
  $('loading').innerHTML = `<b>Can't do that</b><p>${esc(msg)}</p>
    <p style="margin-top:16px"><a href="index.html" style="color:var(--green)">Back to the league</a></p>`;
}

async function pickMatch() {
  const { data } = await supabase.from('matches')
    .select('id,week,played_on,bay')
    .or(`home_team.eq.${profile.team_id},away_team.eq.${profile.team_id}`)
    .order('played_on', { ascending:false }).limit(5);

  if (!data?.length) return fail('No rounds scheduled for your team yet.');
  if (data.length === 1) return load(data[0].id);

  $('loading').hidden = true; $('app').hidden = false;
  $('app').innerHTML = `
    <div class="top"><div class="crumb">${esc(profile.team_name)}</div><h1>Which round?</h1></div>
    <div style="padding:16px">${data.map(m => `
      <a href="?match=${m.id}" style="display:block;background:var(--card);
         border:1px solid var(--rule);padding:14px 16px;margin-bottom:9px;
         text-decoration:none;color:inherit">
        <b style="display:block;font-size:16px">Week ${m.week}${m.bay ? ' · Bay ' + m.bay : ''}</b>
        <span style="font-size:12px;color:var(--dim)">${new Date(m.played_on + 'T12:00:00')
          .toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}</span>
      </a>`).join('')}</div>`;
}

async function load(id) {
  const [{ data: m, error }, { data: pl }] = await Promise.all([
    supabase.from('matches').select('*').eq('id', id).maybeSingle(),
    supabase.rpc('players_in_bay', { p_match: id })
  ]);

  if (error || !m) return fail('That round doesn\u2019t exist.');
  if (![m.home_team, m.away_team].includes(profile.team_id))
    return fail('Your team isn\u2019t in that bay.');

  match = m;
  players = pl || [];

  const [{ data: ws }, { data: money }, { data: ent }] = await Promise.all([
    supabase.from('week_settings').select('*').eq('week', m.week).maybeSingle(),
    supabase.from('contest_money').select('*').eq('week', m.week),
    supabase.from('entrant_list').select('*').eq('week', m.week)
  ]);
  settings = ws || {};
  pots = Object.fromEntries((money||[]).map(p => [p.kind, p]));
  entrants = ent || [];

  await refreshBoard();
  render();
  listen();
}

async function refreshBoard() {
  const [{ data: b }, { data: e }] = await Promise.all([
    supabase.from('contest_board').select('*').eq('week', match.week),
    supabase.from('entrant_list').select('*').eq('week', match.week)
  ]);
  board = b || [];
  entrants = e || [];
}

/* Who can have a number put up against them: whoever paid into
   that pot. If nobody's been entered, the pot isn't being run
   that way this week and anyone in the bay can go up. */
/* One entry covers all three, so eligibility is the same for
   each of them. If nobody has entered, the pot isn't being run
   that way this week and anyone in the bay can go up. */
function eligible() {
  if (!entrants.length) return players;
  const paid = new Set(entrants.filter(e => e.paid).map(e => e.profile_id));
  return players.filter(p => paid.has(p.id));
}

const myEntry = () => entrants.find(e => e.profile_id === profile.id);

/* ------------------------------------------------------------
   Render
------------------------------------------------------------ */
function running() {
  const out = [];
  if (settings.ctp_hole)       out.push(['ctp', settings.ctp_hole]);
  if (settings.long_putt_hole) out.push(['long_putt', settings.long_putt_hole]);
  if (settings.chip_in_any !== false) out.push(['chip_in', null]);
  return out;
}

function render() {
  const list = running();
  $('loading').hidden = true;
  $('app').hidden = false;

  if (!list.length) {
    $('app').innerHTML = `
      <div class="top">
        <div class="crumb">Week ${match.week}${match.bay ? ' · Bay ' + match.bay : ''}</div>
        <h1>The board</h1></div>
      <div class="contest"><p class="hint2">
        Nothing running this week.</p></div>`;
    return;
  }

  $('app').innerHTML = `
    <div class="top">
      <div class="crumb">Week ${match.week}${match.bay ? ' · Bay ' + match.bay : ''}</div>
      <h1>The board</h1>
      <p>What's written on the wall, so the other bays can see it too.
         Chris ticks them off at the end.</p>
    </div>
    ${entryLine()}
    ${list.map(([kind, hole]) => panel(kind, hole)).join('')}
    <div class="foot3">
      <div class="shell">
        <span class="t" id="foottext">Updates as other bays post.</span>
        <button class="bell" id="bell">Tell me if I'm beaten</button>
        <a href="enter-scores.html?match=${match.id}">The card</a>
      </div>
    </div>`;

  list.forEach(([kind]) => wire(kind));
  wireEntry();
  wireBell();
}

function panel(kind, hole) {
  const k = KINDS[kind];
  const marks = board.filter(b => b.kind === kind);
  const pot = pots[kind];

  const rows = marks.length ? marks.map(b => `
    <div class="mark${b.standing === 1 && k.better ? ' lead' : ''}${b.profile_id === profile.id ? ' mine' : ''}">
      <span class="rk">${k.better ? b.standing : '·'}</span>
      <div class="nm2"><b>${esc(b.full_name || 'Someone')}</b>
        <span>${esc(b.team_name || '')}${b.bay ? ' · bay ' + b.bay : ''}</span></div>
      <span class="val">${b.value != null ? b.value + (b.unit === 'in' ? '"' : "'") : '—'}</span>
      <span class="tag2 ${b.confirmed ? 'tag-ok' : 'tag-new'}">${b.confirmed ? 'CHECKED' : 'ON THE BOARD'}</span>
    </div>`).join('')
    : `<div class="empty4">Nothing up yet${k.better ? ' — first one on the board sets it' : ''}.</div>`;

  return `
  <div class="contest" data-k="${kind}">
    <div class="chead">
      <h2>${k.label}</h2>
      ${hole ? `<span class="hole">HOLE ${hole}</span>` : ''}
      ${pot && pot.total ? `<span class="pot">$${Number(pot.total).toFixed(0)}
        <span>${Number(pot.carried) > 0
          ? '$' + Number(pot.carried).toFixed(0) + ' rolled over'
          : (pot.entries ? pot.entries + ' in' : 'pot')}</span></span>` : ''}
    </div>
    <p class="hint2">${
      kind === 'ctp'       ? 'Closest wins it. Feet and inches off the pin.' :
      kind === 'long_putt' ? 'Longest wins it.' :
                             'From off the green. Everyone who does it goes up.'
    }</p>

    <div class="board2">${rows}</div>

    <div class="post2">
      ${eligible().length ? `
      <button type="button" data-open="${kind}">Put one on the board</button>
      <div class="form2" data-form="${kind}">
        <div class="who2" data-who="${kind}">
          ${eligible().map(p => `
            <button type="button" data-id="${p.id}" aria-pressed="false" style="--c:${p.accent}">
              <i></i>${esc(p.full_name)}<span>${esc(p.team_name)}</span>
            </button>`).join('')}
        </div>
        <div class="row3">
          ${k.unit ? `
          <div class="fld">
            <label for="v-${kind}">How far</label>
            <input id="v-${kind}" type="number" inputmode="decimal" step="0.1" placeholder="0">
          </div>
          <select id="u-${kind}"><option value="ft">feet</option><option value="in">inches</option></select>
          ` : ''}
          <button class="save" data-save="${kind}" disabled>Post it</button>
        </div>
        <div class="msg3" data-msg="${kind}"></div>
      </div>` : `
      <p class="none2">Nobody in your bay is in this one.</p>`}
    </div>
  </div>`;
}

/* One entry, one line, covering all three. */
function entryLine() {
  const fee   = pots.ctp?.per_entry ?? 10;
  const mine  = myEntry();
  const paid  = entrants.filter(e => e.paid).length;
  const owing = entrants.filter(e => !e.paid).length;

  if (mine && mine.paid) {
    return `<div class="entry in">
      <b>You're in.</b> ${paid} paid up${owing ? `, ${owing} still to settle` : ''}.
    </div>`;
  }
  if (mine) {
    return `<div class="entry pending">
      <div>
        <b>Name down, money not in yet.</b>
        Give Chris your $${fee} before you tee off.
        <button type="button" data-out="1">Take my name off</button>
      </div>
    </div>`;
  }
  return `<div class="entry out">
    <div>
      <b>Not in tonight.</b>
      $${fee} covers all three — closest to the pin, long putt and the chip-in.
      ${paid ? `${paid} already in.` : ''}
    </div>
    <button type="button" data-in="1">I'm in</button>
  </div>`;
}

/* ------------------------------------------------------------
   Posting
------------------------------------------------------------ */
function wire(kind) {
  const open = document.querySelector(`[data-open="${kind}"]`);
  const form = document.querySelector(`[data-form="${kind}"]`);
  const who  = document.querySelector(`[data-who="${kind}"]`);
  const save = document.querySelector(`[data-save="${kind}"]`);
  const msg  = document.querySelector(`[data-msg="${kind}"]`);
  let chosen = null;

  open.addEventListener('click', () => {
    form.classList.toggle('on');
    open.textContent = form.classList.contains('on') ? 'Never mind' : 'Put one on the board';
  });

  who.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => {
      chosen = b.dataset.id;
      who.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      save.disabled = false;
      const inp = $('v-' + kind);
      if (inp) inp.focus();
    }));

  save.addEventListener('click', async () => {
    if (!chosen) return;
    const inp = $('v-' + kind);
    const val = inp ? parseFloat(inp.value) : null;

    if (inp && (isNaN(val) || val <= 0)) {
      msg.textContent = 'How far was it?'; msg.className = 'msg3 err';
      inp.focus(); return;
    }

    save.disabled = true;
    msg.textContent = 'Posting…'; msg.className = 'msg3';

    const p = players.find(x => x.id === chosen);
    const { error } = await supabase.from('side_contests').insert({
      match_id: match.id, kind,
      hole: kind === 'ctp' ? settings.ctp_hole
          : kind === 'long_putt' ? settings.long_putt_hole : null,
      winner_id: chosen,
      team_id: p?.team_id || null,
      value: inp ? val : null,
      unit: inp ? $('u-' + kind).value : null,
      recorded_by: profile.id
    });

    if (error) {
      save.disabled = false;
      msg.textContent = error.message; msg.className = 'msg3 err';
      return;
    }

    await refreshBoard();
    render();
  });
}

function wireEntry() {
  document.querySelectorAll('[data-in]').forEach(b =>
    b.addEventListener('click', async () => {
      b.disabled = true;
      const { error } = await supabase.from('contest_entrants').insert({
        week: match.week, profile_id: profile.id
      });
      if (error) { b.disabled = false; alert(error.message); return; }
      await refreshBoard();
      render();
    }));

  document.querySelectorAll('[data-out]').forEach(b =>
    b.addEventListener('click', async () => {
      b.disabled = true;
      await supabase.from('contest_entrants').delete()
        .eq('week', match.week).eq('profile_id', profile.id);
      await refreshBoard();
      render();
    }));
}

/* ------------------------------------------------------------
   Live — the point of this, on league night
------------------------------------------------------------ */
let watching = false;

function myBest(kind) {
  return board.find(b => b.kind === kind && b.profile_id === profile.id);
}

function listen() {
  supabase.channel('board-' + match.week)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'side_contests' },
        async () => {
          const before = board.slice();
          await refreshBoard();
          announce(before);
          render();
        })
    .subscribe();
}

/* Work out whether the change knocked anyone off, and say so. */
function announce(before) {
  for (const [kind, k] of Object.entries(KINDS)) {
    if (!k.better) continue;

    const wasLead = before.find(b => b.kind === kind && b.standing === 1);
    const nowLead = board.find(b => b.kind === kind && b.standing === 1);
    if (!nowLead) continue;
    if (wasLead && wasLead.id === nowLead.id) continue;

    const val = nowLead.value + (nowLead.unit === 'in' ? '"' : "'");

    /* it was mine and now it isn't */
    if (wasLead && wasLead.profile_id === profile.id) {
      buzz(`${k.label} — you've been beaten`,
           `${nowLead.full_name} went ${val} from bay ${nowLead.bay || '?'}.`, true);
    } else if (nowLead.profile_id === profile.id) {
      buzz(`${k.label} — that's you on top`, `${val}. For now.`, false);
    } else {
      buzz(`New ${k.label.toLowerCase()}`,
           `${nowLead.full_name} at ${val}, bay ${nowLead.bay || '?'}.`, false);
    }
  }
}

function buzz(title, body, alert) {
  $('buzztext').innerHTML = `<b>${esc(title)}</b>${esc(body)}`;
  $('buzz').classList.add('on');
  clearTimeout(buzz._t);
  buzz._t = setTimeout(() => $('buzz').classList.remove('on'), 9000);

  if (alert && watching && 'Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: 'apple-touch-icon.png', tag: 'kgl-contest' });
  }
  if (alert && navigator.vibrate) navigator.vibrate([60, 40, 60]);
}

$('buzzclose').addEventListener('click', () => $('buzz').classList.remove('on'));

function wireBell() {
  const bell = $('bell');
  if (!('Notification' in window)) { bell.remove(); return; }

  if (Notification.permission === 'granted') {
    watching = true;
    bell.textContent = 'Watching';
    bell.disabled = true;
    return;
  }

  bell.addEventListener('click', async () => {
    const res = await Notification.requestPermission();
    if (res === 'granted') {
      watching = true;
      bell.textContent = 'Watching';
      bell.disabled = true;
      $('foottext').textContent = 'You\u2019ll get a nudge if someone takes it off you.';
    } else {
      bell.textContent = 'Blocked';
      bell.disabled = true;
    }
  });
}
</script>
