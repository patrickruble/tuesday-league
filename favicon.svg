<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Katy Golf League mark: pin and ball.
       Kept to three shapes so it still reads at 16px. -->
  <rect width="64" height="64" fill="#007041"/>

  <!-- flag -->
  <path d="M26 12 L50 20 L26 28 Z" fill="#B8EB7A"/>

  <!-- pin -->
  <rect x="22" y="10" width="5" height="38" fill="#FFFFFF"/>

  <!-- ball -->
  <circle cx="24.5" cy="52" r="7" fill="#FFFFFF"/>
</svg>
