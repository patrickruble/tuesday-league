<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign off a card — Katy Golf League</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#007041">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/extra.css">
<style>
:root{--them:#5F6F66;--us:#5F6F66;--warn:#B91C1C}
body{padding-bottom:140px}
.shell{max-width:560px;margin:0 auto}

.top{background:var(--green);color:#fff;padding:16px 18px 18px}
.crumb{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--lime);font-weight:600}
.top h1{font-size:26px;margin:11px 0 0;letter-spacing:-.02em;text-transform:uppercase;
  font-family:var(--display);font-weight:800;line-height:1}
.ask{margin-top:10px;font-size:14px;color:rgba(255,255,255,.82);line-height:1.5}
.ask b{color:#fff}
.who{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  margin-top:16px;padding-top:15px;border-top:1px solid rgba(255,255,255,.2)}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.right{justify-content:flex-end;text-align:right}
.tile{width:32px;height:32px;flex:none;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:11px;color:#fff}
.side b{font-size:13px;line-height:1.2;font-weight:600;display:block}
.side span{font-size:10px;color:rgba(255,255,255,.55)}
.mid2{font-family:var(--data);font-size:10px;color:rgba(255,255,255,.5)}

.panel2{background:var(--card);margin-top:1px;padding:16px 18px}
.panel2 h2{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  margin:0 0 13px;font-family:var(--display);font-weight:800}

.cardwrap{overflow-x:auto;border:1px solid var(--rule)}
table.sc{border-collapse:collapse;width:100%;min-width:460px;font-family:var(--data);font-size:11px}
table.sc th,table.sc td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:9px 0;text-align:center;width:7.6%}
table.sc .lab{width:22%;text-align:left;padding-left:12px;font-family:var(--body);
  font-size:11px;font-weight:600;white-space:nowrap}
table.sc thead th{background:var(--green);color:#fff;font-weight:400;border-color:rgba(255,255,255,.2)}
table.sc thead .lab{background:var(--green);color:#fff}
.totc{background:var(--green-deep);color:#fff;font-weight:600;width:11%}
tr.faint td,tr.faint .lab{color:var(--dim);background:#F7F9F7}
.stroke{position:relative}
.stroke::before{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;
  border-radius:50%;background:var(--them)}
tr.pts td{background:#F2F7EE;font-weight:600}
tr.pts .lab{background:#F2F7EE}
tr.pts .p2{color:var(--green);background:#E4F2D6}
tr.pts .p3{color:#fff;background:var(--them)}
tr.pts .p0{color:#AAB4AD}

.shot{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start}
.shot img{width:104px;height:104px;object-fit:cover;border:1px solid var(--rule);
  background:#EEF1EE;display:block;cursor:zoom-in}
.shot .meta{font-size:12px;color:var(--dim);line-height:1.5}
.shot .meta b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.zoom{position:fixed;inset:0;background:rgba(8,18,13,.94);display:none;place-items:center;
  padding:20px;z-index:30;cursor:zoom-out}
.zoom.on{display:grid}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}

.disputebox{display:none;margin-top:14px}
.disputebox.on{display:block}
.disputebox label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.disputebox textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--rule);background:#FBFCFB;min-height:88px;resize:vertical}
.disputebox textarea:focus{outline:none;border-color:var(--warn);background:#fff}
.disputebox .hint{font-size:12px;color:var(--dim);margin-top:7px}

.bar2{position:fixed;left:0;right:0;bottom:0;background:var(--green-deep);color:#fff;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(0,0,0,.14);z-index:20}
.bar2 .shell{display:flex;flex-direction:column;gap:9px}
.bar2 .note{font-size:11px;color:rgba(255,255,255,.6);text-align:center}
.bar2 .note.err{color:#FFB4B4}
.bar2 .btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bar2 button{border:0;padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.ok{background:var(--lime);color:var(--green-deep)}
.no{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.no:hover{background:rgba(255,255,255,.08)}
.ok:hover{background:#fff}
.ok[disabled],.no[disabled]{opacity:.45;cursor:default}

.state{padding:44px 18px;text-align:center;background:var(--card);margin-top:1px}
.state .tick{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  margin:0 auto 16px;font-size:25px;color:#fff}
.state h2{font-size:22px;margin:0 0 9px;font-family:var(--display);font-weight:800}
.state p{margin:0 auto;color:var(--dim);font-size:14px;max-width:38ch;line-height:1.55}
.state a{display:inline-block;margin-top:18px;background:var(--green);color:#fff;
  text-decoration:none;padding:11px 18px;font-size:14px;font-weight:600}
</style>
</head>
<body>

<div class="shell">
  <div id="loading" class="state"><p>Loading the card…</p></div>
  <div id="app" hidden></div>
</div>

<div class="zoom" id="zoom"><img alt="Scorecard photo, enlarged"></div>

<script type="module">
import { supabase, requireAuth, me } from './assets/db.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const params  = new URLSearchParams(location.search);
const roundId = params.get('round');

let round = null, profile = null;

(async () => {
  const session = await requireAuth();
  if (!session) return;

  profile = await me();
  if (!profile) return fail('Could not load your profile.');
  if (!roundId) return fail('No card specified. Open this from a link or the dashboard.');

  /* round_scores has the computed points; rounds has the status fields */
  const { data, error } = await supabase
    .from('round_scores')
    .select('*')
    .eq('id', roundId)
    .maybeSingle();

  if (error) return fail(error.message);
  if (!data)  return fail('That card either doesn\u2019t exist or isn\u2019t yours to sign.');

  round = data;

  const [{ data: r }, { data: teams }, { data: photo }] = await Promise.all([
    supabase.from('rounds').select('status,submitted_at,submitted_by,dispute_note').eq('id', roundId).single(),
    supabase.from('teams').select('id,name,crest,accent,handicap'),
    supabase.from('round_photos').select('storage_path,uploaded_at,uploaded_by')
      .eq('round_id', roundId).eq('superseded', false).maybeSingle()
  ]);

  const { data: match } = await supabase.from('matches')
    .select('week,played_on,bay,home_team,away_team,course_id').eq('id', round.match_id).single();
  const { data: course } = await supabase.from('courses')
    .select('name,nine,pars,stroke_index').eq('id', match.course_id).single();

  const byId  = Object.fromEntries((teams||[]).map(t => [t.id, t]));
  const them  = byId[round.team_id];
  const usId  = match.home_team === round.team_id ? match.away_team : match.home_team;
  const us    = byId[usId];

  if (r.status === 'confirmed') return done('ok', 'Already signed off',
    `${them.name}'s card is on the leaderboard. Nothing else to do.`);
  if (r.status === 'draft') return fail(`${them.name} haven't finished their card yet.`);
  if (r.status === 'disputed') return done('warn', 'Already disputed',
    r.dispute_note ? `Reason given: ${r.dispute_note}` : 'Chris has been told.');
  if (profile.team_id !== usId) return fail('You didn\u2019t play this match, so you can\u2019t sign it.');

  let photoUrl = null;
  if (photo) {
    const { data: signed } = await supabase.storage
      .from('scorecards').createSignedUrl(photo.storage_path, 3600);
    photoUrl = signed?.signedUrl || null;
  }

  render({ them, us, match, course, photoUrl, r });
})();

function fail(msg) {
  $('loading').innerHTML =
    `<div class="tick" style="background:#B91C1C">!</div>
     <h2>Can't do that</h2><p>${esc(msg)}</p>
     <a href="index.html">Back to the league</a>`;
}

function done(kind, title, body) {
  $('loading').hidden = true;
  $('app').hidden = false;
  $('app').innerHTML =
    `<div class="state">
       <div class="tick" style="background:${kind==='ok'?'var(--green)':'#B91C1C'}">${kind==='ok'?'✓':'!'}</div>
       <h2>${esc(title)}</h2><p>${esc(body)}</p>
       <a href="index.html">Back to the league</a>
     </div>`;
  const bar = document.querySelector('.bar2');
  if (bar) bar.remove();
}

/* handicap strokes, mirroring the SQL */
function strokesOn(i, si, hcp) {
  return Math.floor(hcp / 9) + (si[i] <= (hcp % 9) ? 1 : 0);
}

function render({ them, us, match, course, photoUrl, r }) {
  document.documentElement.style.setProperty('--them', them.accent);
  document.documentElement.style.setProperty('--us', us.accent);

  const gross = round.gross || [];
  const pts   = round.points || [];
  const pars  = course.pars;
  const si    = course.stroke_index;
  const hcp   = round.handicap;

  const cells = (vals, cls = () => '') =>
    vals.map((v,i) => `<td class="${cls(v,i)}">${v}</td>`).join('');

  const net = gross.map((g,i) => g - strokesOn(i, si, hcp));

  const when = r.submitted_at
    ? new Date(r.submitted_at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
    : '';

  $('loading').hidden = true;
  $('app').hidden = false;
  $('app').innerHTML = `
  <div class="top">
    <div class="crumb">Week ${match.week} · ${new Date(match.played_on).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}${match.bay ? ' · Bay ' + match.bay : ''}</div>
    <h1>Sign off this card</h1>
    <p class="ask"><b>${esc(them.name)}</b> submitted their scorecard. You played them,
      so they need someone from <b>${esc(us.name)}</b> to confirm the numbers match the photo.</p>
    <div class="who">
      <div class="side">
        <div class="tile" style="background:${them.accent}">${esc(them.crest)}</div>
        <div><b>${esc(them.name)}</b><span>Submitted ${when}</span></div>
      </div>
      <div class="mid2">VS</div>
      <div class="side right">
        <div><b>${esc(us.name)}</b><span>You</span></div>
        <div class="tile" style="background:${us.accent}">${esc(us.crest)}</div>
      </div>
    </div>
  </div>

  <div class="panel2">
    <h2>Their card — ${esc(course.name)} ${esc(course.nine)} 9</h2>
    <div class="cardwrap">
      <table class="sc">
        <thead><tr><th class="lab">Hole</th>
          ${pars.map((_,i)=>`<th>${i+1}</th>`).join('')}<th class="totc">TOT</th></tr></thead>
        <tbody>
          <tr class="faint"><td class="lab">Par</td>${cells(pars)}
            <td class="totc">${pars.reduce((a,b)=>a+b,0)}</td></tr>
          <tr><td class="lab">Gross</td>
            ${gross.map((g,i)=>`<td class="${strokesOn(i,si,hcp)?'stroke':''}">${g}</td>`).join('')}
            <td class="totc">${gross.reduce((a,b)=>a+b,0)}</td></tr>
          <tr><td class="lab">Net</td>${cells(net)}
            <td class="totc">${net.reduce((a,b)=>a+b,0)}</td></tr>
          <tr class="pts"><td class="lab">Points</td>
            ${cells(pts, v => 'p'+v)}
            <td class="totc">${round.total_points}</td></tr>
        </tbody>
      </table>
    </div>
    <p style="font-size:12px;color:var(--dim);margin:11px 0 0">
      Dots mark holes where they got a handicap stroke. Team handicap ${hcp}.
      Points are calculated from the gross row, not typed.
    </p>
  </div>

  <div class="panel2">
    <h2>Their photo</h2>
    ${photoUrl ? `
    <div class="shot">
      <img id="thumb" src="${esc(photoUrl)}" alt="Scorecard photo">
      <div class="meta"><b>Simulator screen</b>
        Tap to enlarge. Check the gross row above against what the screen says.</div>
    </div>` : `
    <p style="font-size:13px;color:#B91C1C;margin:0">
      No photo attached. That shouldn't be possible — tell Chris.</p>`}
    <div class="disputebox" id="disputebox">
      <label for="why">What's wrong with it?</label>
      <textarea id="why" placeholder="e.g. hole 7 was a 3, not a 2"></textarea>
      <div class="hint">This goes to ${esc(them.name)} and to Chris. The card stays
        off the leaderboard until it's sorted.</div>
    </div>
  </div>

  <div class="bar2">
    <div class="shell">
      <div class="btns">
        <button class="no" id="btn-no">Something's wrong</button>
        <button class="ok" id="btn-ok">Looks right — sign off</button>
      </div>
      <div class="note" id="note">You can't change their scores, only confirm or dispute</div>
    </div>
  </div>`;

  wire(them);
}

function wire(them) {
  let disputing = false, busy = false;
  const box = $('disputebox'), no = $('btn-no'), ok = $('btn-ok'), note = $('note');

  const say = (t, err) => { note.textContent = t; note.className = 'note' + (err ? ' err' : ''); };
  const lock = on => { busy = on; no.disabled = on; ok.disabled = on; };

  const thumb = $('thumb');
  if (thumb) thumb.addEventListener('click', () => {
    const z = $('zoom');
    z.querySelector('img').src = thumb.src;
    z.classList.add('on');
  });

  no.addEventListener('click', async () => {
    if (busy) return;
    if (!disputing) {
      disputing = true;
      box.classList.add('on');
      no.textContent = 'Send dispute';
      ok.textContent = 'Cancel';
      say('Say what looks wrong, then send it');
      $('why').focus();
      return;
    }
    const why = $('why').value.trim();
    if (!why) { $('why').focus(); return say('Say what\u2019s wrong first', true); }

    lock(true); say('Sending…');
    const { error } = await supabase.from('rounds')
      .update({ status: 'disputed', dispute_note: why }).eq('id', roundId);
    if (error) { lock(false); return say(error.message, true); }
    done('warn', 'Disputed', `${them.name} and Chris have been told. The card won't count until someone sorts it out.`);
  });

  ok.addEventListener('click', async () => {
    if (busy) return;
    if (disputing) {
      disputing = false;
      box.classList.remove('on');
      no.textContent = "Something's wrong";
      ok.textContent = 'Looks right — sign off';
      say("You can't change their scores, only confirm or dispute");
      return;
    }
    lock(true); say('Signing…');
    const { error } = await supabase.from('rounds')
      .update({ status: 'confirmed' }).eq('id', roundId);
    if (error) { lock(false); return say(error.message, true); }
    done('ok', 'Signed off',
      `${them.name}'s ${round.total_points} points are on the leaderboard. That's the last thing anyone needed to do tonight.`);
  });
}

const z = $('zoom');
z.addEventListener('click', () => z.classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') z.classList.remove('on'); });
</script>
</body>
</html>
