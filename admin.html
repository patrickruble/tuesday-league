<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commissioner — Katy Golf League</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#007041">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/extra.css">
<link rel="stylesheet" href="assets/patterns.css">
<style>
:root{--wait:#B45309;--bad:#B91C1C}
.tagged{margin-left:auto;font-family:var(--data);font-size:9px;letter-spacing:.12em;
  background:var(--lime);color:var(--green-deep);padding:4px 8px}
.weekpick{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);
  font-family:var(--data);font-size:11px;padding:7px 10px;margin-left:auto}
.weekpick option{color:var(--ink)}

.tallybar{background:var(--green-deep);color:#fff}
.tallybar .inner{max-width:1040px;margin:0 auto;padding:16px 24px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tallybar b{display:block;font-family:var(--data);font-size:28px;font-weight:600;letter-spacing:-.04em}
.tallybar span{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-top:5px}
.tallybar .hot b{color:var(--lime)}

.bays{margin:24px 0 20px}
.bay{background:var(--card);border:1px solid var(--rule);margin-bottom:10px;
  display:grid;grid-template-columns:52px 1fr;overflow:hidden}
.baynum{background:var(--green);color:#fff;display:grid;place-items:center;
  font-family:var(--data);line-height:1;padding:12px 0}
.baynum b{display:block;font-size:19px;font-weight:600;letter-spacing:-.04em}
.baynum span{display:block;font-size:7px;letter-spacing:.15em;margin-top:4px;opacity:.7}
.entry{display:grid;grid-template-columns:8px 1fr auto auto;gap:12px;align-items:center;
  padding:12px 14px}
.entry + .entry{border-top:1px solid var(--rule)}
.entry i{width:8px;height:30px;display:block;align-self:stretch}
.nm b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.nm span{font-size:11px;color:var(--dim);font-family:var(--data)}
.st{font-family:var(--data);font-size:9px;font-weight:600;letter-spacing:.08em;
  padding:4px 8px;white-space:nowrap}
.s-in{background:var(--green);color:#fff}
.s-wait{background:#FDECD8;color:var(--wait)}
.s-none{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--rule)}
.s-bad{background:#FBE4E4;color:var(--bad)}
.act{background:transparent;border:1px solid var(--rule);padding:7px 11px;font-size:12px;
  cursor:pointer;color:var(--dim);white-space:nowrap;font-family:inherit;text-decoration:none}
.act:hover{border-color:var(--ink);color:var(--ink)}
.act.go{background:var(--green);border-color:var(--green);color:#fff}
.act.go:hover{background:var(--green-deep)}
.act[disabled]{opacity:.35;cursor:default}

.chase{background:var(--card);border:1px solid var(--rule);padding:16px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:40px}
.chase .txt{flex:1;min-width:220px;font-size:13px;color:var(--dim);line-height:1.45}
.chase .txt b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.chase button{background:var(--green);color:#fff;border:0;padding:11px 18px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.chase button:hover{background:var(--green-deep)}

.gate{max-width:520px;margin:60px auto;background:var(--card);border:1px solid var(--rule);
  padding:30px;text-align:center}
.gate h2{font-size:22px;margin:0 0 9px}
.gate p{color:var(--dim);font-size:14px;margin:0}

/* ============================================================
   THE POT — who's paid, ticked off on the night
   ============================================================ */
.potpanel{background:var(--card);border:1px solid var(--rule);margin:20px 0}
.potpanel > header{display:flex;align-items:baseline;gap:14px;padding:13px 16px;
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.potpanel h2{font-size:16px;margin:0;font-family:var(--display);font-weight:800}
.sub2{font-family:var(--data);font-size:11px;color:var(--dim)}
.potbody{padding:6px 0}
.pothead{display:grid;grid-template-columns:1fr 76px;gap:8px;
  padding:8px 16px;font-family:var(--data);font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--rule)}
.potrow{display:grid;grid-template-columns:1fr 76px;gap:8px;
  align-items:center;padding:8px 16px;border-bottom:1px dotted var(--rule)}
.potrow:last-child{border-bottom:0}
.potrow .nm3{font-size:14px;min-width:0}
.potrow .nm3 span{display:block;font-size:11px;color:var(--dim)}
.potrow button{height:34px;border:1px solid var(--rule);background:#FBFCFB;
  cursor:pointer;font-family:var(--data);font-size:10px;letter-spacing:.06em;
  color:var(--dim);padding:0}
.potrow button[data-state="paid"]{background:var(--green);border-color:var(--green);
  color:#fff}
.potrow button[data-state="owed"]{background:#FDF3E7;border-color:#E0B77A;color:#8A5A16}
.potfoot{display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-top:1px solid var(--rule);margin-top:6px;flex-wrap:wrap}
.potfoot span{font-size:12px;color:var(--dim)}
.closewk{background:var(--green);color:#fff;border:0;padding:10px 16px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.closewk:disabled{opacity:.5;cursor:default}
.sub2 b{color:var(--ink);font-size:14px}
.potrow button:hover{filter:brightness(.96)}
@media (max-width:620px){
  .pothead,.potrow{grid-template-columns:1fr 66px;gap:6px;padding:8px 12px}
  .potrow button{height:32px;font-size:9px}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="inner">
    <a class="mark" href="index.html">Katy <svg class="xm" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1.4" y="1.4" width="17.2" height="17.2" rx="1" fill="none"
              stroke="currentColor" stroke-width="2.6"/>
        <path d="M6.2 6.2 L13.8 13.8 M13.8 6.2 L6.2 13.8" stroke="currentColor"
              stroke-width="2.8" stroke-linecap="square"/>
      </svg>
      Golf League</a>
    <nav id="nav" class="adminnav">
      <a href="admin.html" aria-current="page">Tonight</a>
      <a href="rosters.html">Rosters</a>
      <a href="weeks.html">Weeks</a>
      <a href="index.html" class="out">The site</a>
    </nav>
    <span class="tagged">COMMISSIONER</span>
  </div>
</header>

<div id="gate" class="gate" hidden>
  <h2>Commissioner only</h2>
  <p>This page shows who has and hasn't turned in a card. Ask Chris if you need access.</p>
</div>

<div id="app" hidden>
  <div class="title">
    <div class="inner">
      <div>
        <div class="eyebrow" id="sub">—</div>
        <h1>Tonight</h1>
      </div>
      <select class="weekpick" id="weekpick"></select>
    </div>
  </div>

  <div class="tallybar">
    <div class="inner">
      <div><b id="t-in">0</b><span>Cards in</span></div>
      <div class="hot"><b id="t-wait">0</b><span>Awaiting sign-off</span></div>
      <div><b id="t-none">0</b><span>Not started</span></div>
      <div><b id="t-bad">0</b><span>Disputed</span></div>
    </div>
  </div>

  <div class="wrap">
    <div class="potpanel" id="potpanel" hidden>
      <header>
        <h2>The pot</h2>
        <span class="sub2" id="pottotals"></span>
      </header>
      <div class="potbody" id="potbody"></div>
    </div>

    <div class="bays" id="bays"></div>
    <div id="chase"></div>
  </div>
</div>

<div id="loading" class="gate"><p>Loading tonight…</p></div>

<footer>
  <div class="inner">
    <span>Katy Golf League</span>
    <span>Commissioner view</span>
  </div>
</footer>

<script type="module">
import { supabase, requireAuth, me, paintAuthSlot } from './assets/db.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let teams = {}, weeks = [], current = null;

(async () => {
  const session = await requireAuth();
  if (!session) return;
  paintAuthSlot(0);

  const p = await me();
  if (!p || !p.is_admin) {
    $('loading').hidden = true;
    $('gate').hidden = false;
    return;
  }

  const { data: ts } = await supabase.from('teams').select('id,name,crest,accent');
  teams = Object.fromEntries((ts||[]).map(t => [t.id, t]));

  const { data: ms } = await supabase.from('matches')
    .select('week,played_on').order('week', { ascending: false });

  if (!ms || !ms.length) {
    $('loading').innerHTML = '<h2>No matches yet</h2>' +
      '<p>Once the schedule is in the database, this page fills itself in.</p>';
    return;
  }

  weeks = [...new Map(ms.map(m => [m.week, m.played_on])).entries()];
  $('weekpick').innerHTML = weeks.map(([w,d]) =>
    `<option value="${w}">Week ${w} · ${new Date(d + 'T12:00:00').toLocaleDateString([], {day:'numeric',month:'short'})}</option>`
  ).join('');
  $('weekpick').addEventListener('change', e => load(+e.target.value));

  await load(weeks[0][0]);
  $('loading').hidden = true;
  $('app').hidden = false;
})();

/* ------------------------------------------------------------
   The pot
   Everyone who's put their name down, and a tap to say the
   money's in. Three contests across, so one row a person.
------------------------------------------------------------ */
const POT_KINDS = [['ctp','Closest to the pin'], ['long_putt','Long putt'],
                   ['chip_in','Chip-in']];

async function paintPot() {
  if (!current) return;

  const [{ data: ent }, { data: money }] = await Promise.all([
    supabase.from('entrant_list').select('*').eq('week', current),
    supabase.from('contest_money').select('*').eq('week', current)
  ]);

  const rows = ent || [];
  const panel = document.getElementById('potpanel');
  panel.hidden = false;

  if (!rows.length) {
    document.getElementById('pottotals').textContent = '';
    document.getElementById('potbody').innerHTML = `
      <div style="padding:20px 16px;font-size:13px;color:var(--dim);line-height:1.5">
        Nobody's put their name down for week ${current} yet. People enter from the
        contest board on their phone, then you tick them off here once you've got
        the money.
      </div>`;
    return;
  }

  const fee  = (money || [])[0]?.per_entry ?? 10;
  const paid = rows.filter(r => r.paid).length;
  const owed = rows.length - paid;

  document.getElementById('pottotals').innerHTML =
    `<b>$${(paid * fee).toFixed(0)}</b> in from ${paid}` +
    (owed ? ` &nbsp;·&nbsp; <span style="color:#B45309">${owed} still owing $${(owed*fee).toFixed(0)}</span>` : '') +
    ' &nbsp;·&nbsp; ' +
    (money || []).filter(m => m.total)
      .map(m => {
        const label = POT_KINDS.find(([k]) => k === m.kind)?.[1] || m.kind;
        const roll = Number(m.carried) > 0
          ? ` (inc $${Number(m.carried).toFixed(0)} rolled over)` : '';
        return `${label} $${Number(m.total).toFixed(0)}${roll}`;
      }).join(' &nbsp;·&nbsp; ');

  document.getElementById('potbody').innerHTML = `
    <div class="pothead"><span>Who</span><span>$${fee}</span></div>
    ${rows.map(r => `
      <div class="potrow">
        <div class="nm3">${esc(r.full_name)}<span>${esc(r.team_name || '')}</span></div>
        <button data-pot="${r.profile_id}" data-state="${r.paid ? 'paid' : 'owed'}">${
          r.paid ? 'PAID' : 'OWES'}</button>
      </div>`).join('')}
    <div class="potfoot">
      <button class="closewk" id="closewk">Close week ${current}</button>
      <span>Rolls anything nobody won into next week.</span>
    </div>`;

  document.querySelectorAll('[data-pot]').forEach(b =>
    b.addEventListener('click', async () => {
      b.disabled = true;
      const { error } = await supabase.from('contest_entrants')
        .update({ paid: b.dataset.state !== 'paid' })
        .eq('week', current).eq('profile_id', b.dataset.pot);
      if (error) { b.disabled = false; alert(error.message); return; }
      paintPot();
    }));

  document.getElementById('closewk').addEventListener('click', async function () {
    if (!confirm(`Close week ${current}? Anything nobody won rolls into next week.`)) return;
    this.disabled = true;
    const { data, error } = await supabase.rpc('close_week', { p_week: current });
    if (error) { this.disabled = false; alert(error.message); return; }
    const rolled = (data || []).filter(r => r.rolled);
    alert(rolled.length
      ? 'Rolled over: ' + rolled.map(r =>
          `${POT_KINDS.find(([k]) => k === r.kind)?.[1] || r.kind} $${Number(r.amount).toFixed(0)}`
        ).join(', ')
      : 'All three were won. Nothing to roll over.');
    paintPot();
  });
}

async function load(week) {
  current = week;

  const { data: matches } = await supabase.from('matches')
    .select('id,week,played_on,bay,home_team,away_team,course_id')
    .eq('week', week).order('bay');

  const ids = (matches||[]).map(m => m.id);
  const { data: rounds } = await supabase.from('rounds')
    .select('id,match_id,team_id,status,submitted_at,dispute_note,attested_method,attested_name')
    .in('match_id', ids.length ? ids : ['00000000-0000-0000-0000-000000000000']);

  const { data: scores } = await supabase.from('round_scores')
    .select('id,total_points')
    .in('match_id', ids.length ? ids : ['00000000-0000-0000-0000-000000000000']);
  const points = Object.fromEntries((scores||[]).map(s => [s.id, s.total_points]));

  const byMatch = {};
  (rounds||[]).forEach(r => (byMatch[r.match_id] ??= []).push(r));

  let nIn = 0, nWait = 0, nNone = 0, nBad = 0;
  const chase = [];

  $('bays').innerHTML = (matches||[]).map(m => {
    const rs = byMatch[m.id] || [];
    const row = teamId => {
      const t = teams[teamId] || { name:'—', crest:'—', accent:'#5F6F66' };
      const r = rs.find(x => x.team_id === teamId);
      const other = rs.find(x => x.team_id !== teamId);

      let cls, label, action = '';
      if (!r || r.status === 'draft') {
        cls='s-none'; label='NOT STARTED'; nNone++;
        chase.push(`${t.name} haven't entered a card`);
        action = `<button class="act" data-copy="${esc(t.name)}">Copy nudge</button>`;
      } else if (r.status === 'submitted') {
        const opp = teams[other ? other.team_id : null];
        const hrs = r.submitted_at
          ? (Date.now() - new Date(r.submitted_at)) / 3600000 : 0;
        cls='s-wait';
        label = 'WAITING ON ' + (opp ? opp.name.toUpperCase() : 'OPPONENT');
        nWait++;
        chase.push(`${opp ? opp.name : 'Someone'} still to sign ${t.name}'s card`);
        /* after a couple of hours it's clearly not happening
           tonight, so offer to do it rather than leaving it */
        action = hrs >= 2
          ? `<button class="act go" data-conf="${r.id}"
               title="Waiting ${hrs.toFixed(0)}h">Confirm it</button>`
          : `<a class="act go" href="verify.html?round=${r.id}">Open</a>`;
      } else if (r.status === 'disputed') {
        cls='s-bad'; label='DISPUTED'; nBad++;
        chase.push(`${t.name}'s card is disputed`);
        action = `<a class="act go" href="verify.html?round=${r.id}">Review</a>`;
      } else {
        /* flag the weaker signature so it's visible rather than
           buried in the data */
        const inPerson = r.attested_method === 'in_person';
        cls   = 's-in';
        label = inPerson ? 'SIGNED IN PERSON' : 'CONFIRMED';
        nIn++;
        action = inPerson
          ? `<a class="act" href="verify.html?round=${r.id}">Look</a>`
          : `<button class="act" disabled>Done</button>`;
      }

      const when = r?.submitted_at
        ? new Date(r.submitted_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
        : 'No card yet';
      const pts = r && points[r.id] != null ? points[r.id] + ' PTS · ' : '';

      return `<div class="entry">
        <i style="background:${t.accent}"></i>
        <div class="nm"><b>${esc(t.name)}</b><span>${pts}${when}</span></div>
        <span class="st ${cls}">${esc(label)}</span>
        ${action}
      </div>`;
    };

    return `<div class="bay">
      <div class="baynum"><b>${m.bay ?? '—'}</b><span>BAY</span></div>
      <div>${row(m.home_team)}${row(m.away_team)}</div>
    </div>`;
  }).join('');

  $('t-in').textContent = nIn;
  $('t-wait').textContent = nWait;
  $('t-none').textContent = nNone;
  $('t-bad').textContent = nBad;

  const wk = weeks.find(w => w[0] === week);
  $('sub').textContent = `Week ${week} · ` +
    new Date(wk[1] + 'T12:00:00').toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'});

  $('chase').innerHTML = chase.length ? `
    <div class="chase">
      <div class="txt"><b>${chase.length} thing${chase.length===1?'':'s'} outstanding</b>
        ${esc(chase.slice(0,3).join('. '))}${chase.length>3 ? ` and ${chase.length-3} more.` : '.'}</div>
      <button type="button" id="copyall">Copy a message for the group chat</button>
    </div>` : `
    <div class="chase"><div class="txt"><b>Week ${week} is done</b>
      Every card is in and signed off.</div></div>`;

  if (chase.length) {
    $('copyall').addEventListener('click', async function(){
      const text = `Week ${week} — still outstanding:\n` +
        chase.map(c => '· ' + c).join('\n') +
        `\n\n${location.origin}${location.pathname.replace(/admin\.html$/,'')}`;
      try { await navigator.clipboard.writeText(text); this.textContent = 'Copied'; }
      catch { this.textContent = 'Copy failed'; }
      this.disabled = true;
    });
  }

  paintPot();

  document.querySelectorAll('[data-conf]').forEach(b =>
    b.addEventListener('click', async function(){
      if (!confirm('Confirm this card yourself? The other team never signed it.')) return;
      this.disabled = true;
      this.textContent = 'Confirming…';
      const { error } = await supabase.rpc('confirm_as_commissioner', {
        p_round: this.dataset.conf,
        p_why: 'Confirmed by the commissioner — no sign-off from the other team'
      });
      if (error) { this.disabled = false; this.textContent = 'Confirm it'; alert(error.message); return; }
      load(current);
    }));

  document.querySelectorAll('[data-copy]').forEach(b =>
    b.addEventListener('click', async function(){
      try {
        await navigator.clipboard.writeText(
          `${this.dataset.copy} — your week ${week} card still isn't in. ` +
          `${location.origin}${location.pathname.replace(/admin\.html$/,'')}enter-scores.html`);
        this.textContent = 'Copied';
      } catch { this.textContent = 'Copy failed'; }
      this.disabled = true;
    }));
}

$('navtoggle').addEventListener('click', function(){
  const n = $('nav'), open = n.classList.toggle('open');
  this.setAttribute('aria-expanded', open);
  this.textContent = open ? 'CLOSE' : 'MENU';
});
</script>
</body>
</html>
