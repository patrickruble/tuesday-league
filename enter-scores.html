<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter your card — Katy Golf League</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#007041">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#007041;--green-deep:#00522F;--lime:#B8EB7A;
  --field:#DCE1DC;--card:#FFFFFF;--ink:#10221A;--dim:#5F6F66;--rule:#D2D8D2;
  --accent:#007041;--warn:#B91C1C;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --data:'Martian Mono','Courier New',monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--field);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:130px;
  -webkit-tap-highlight-color:transparent;
}
h1,h2{margin:0;font-family:var(--display);font-weight:800;line-height:1}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.shell{max-width:560px;margin:0 auto}

/* ============================================================
   HEADER — bay first, because that's what you check
   ============================================================ */
.top{background:var(--green);color:#fff;padding:14px 16px 16px}
.crumb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--lime);font-weight:600}
.bayline{display:flex;align-items:center;gap:13px;margin-top:11px}
.bay{background:var(--lime);color:var(--green-deep);font-family:var(--data);
  font-weight:600;padding:7px 11px;line-height:1;text-align:center;flex:none}
.bay b{display:block;font-size:23px;letter-spacing:-.04em}
.bay span{display:block;font-size:7px;letter-spacing:.16em;margin-top:3px}
.course{font-size:12px;color:rgba(255,255,255,.78);line-height:1.35;flex:1;min-width:0}
.course b{display:block;color:#fff;font-size:16px;font-weight:600}
.side{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.72)}
.side .tile{width:28px;height:28px;flex:none;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:10px;color:#fff}
.side b{color:#fff}

/* ============================================================
   HOLES — one tap each
   ============================================================ */
.holes{margin-top:1px}
.hole{background:var(--card);border-bottom:1px solid var(--rule);padding:11px 14px}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hno{font-family:var(--data);font-size:19px;font-weight:600;letter-spacing:-.05em;
  min-width:26px}
.hpar{font-family:var(--data);font-size:10px;color:var(--dim);letter-spacing:.06em}
.stroke{display:inline-flex;align-items:center;gap:4px;font-family:var(--data);
  font-size:9px;letter-spacing:.06em;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  padding:3px 6px;margin-left:2px}
.stroke i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.pill{margin-left:auto;font-family:var(--data);font-size:13px;font-weight:600;
  min-width:34px;height:26px;display:grid;place-items:center;background:#F2F4F2;color:var(--dim)}
.pill.p1{background:#EDF3EA;color:var(--ink)}
.pill.p2{background:#E4F2D6;color:var(--green)}
.pill.p3{background:var(--accent);color:#fff}
.pill.p0{background:#F2F4F2;color:#B4BDB7}

/* the number row — the whole point of the page */
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.nums button{
  height:52px;border:1px solid var(--rule);background:#FBFCFB;cursor:pointer;
  font-family:var(--data);font-size:18px;font-weight:600;color:var(--ink);
  padding:0;position:relative;
}
.nums button.par::after{
  content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:14px;height:2px;background:var(--rule);
}
.nums button[aria-pressed="true"]{
  background:var(--green);border-color:var(--green);color:#fff;
}
.nums button[aria-pressed="true"].eag{background:var(--accent);border-color:var(--accent)}
.nums button:active{transform:scale(.96)}

/* a short flourish for something under par — enough to notice,
   not enough to sit through nine times */
@keyframes pop{
  0%  {transform:scale(1)}
  40% {transform:scale(1.14)}
  100%{transform:scale(1)}
}
.nums button.cheer{animation:pop .34s ease}
@keyframes glow{
  0%  {box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}
  100%{box-shadow:0 0 0 14px transparent}
}
.hole.cheer .pill{animation:glow .55s ease}
@media (prefers-reduced-motion:reduce){
  .nums button.cheer,.hole.cheer .pill{animation:none}
}

/* a run of two or more under par gets marked as you build it */
.streak{display:inline-flex;align-items:center;gap:5px;font-family:var(--data);
  font-size:9px;letter-spacing:.08em;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  padding:3px 7px;margin-left:8px}

/* ============================================================
   DRIVES — who hit the one you used
   ============================================================ */
.panel{background:var(--card);margin-top:1px;padding:14px 16px}
.panel h2{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  margin-bottom:11px}
.drive{display:flex;align-items:center;gap:11px;padding:8px 0}
.drive + .drive{border-top:1px solid var(--rule)}
.drive .who{flex:1;font-size:15px;font-weight:500;min-width:0}
.drive .cnt{font-family:var(--data);font-size:17px;font-weight:600;min-width:22px;
  text-align:center}
.drive button{width:40px;height:40px;border:1px solid var(--rule);background:#FBFCFB;
  font-size:19px;cursor:pointer;color:var(--ink);line-height:1;padding:0}
.drive button:disabled{opacity:.3;cursor:default}
.short{font-size:12px;color:var(--warn);margin-top:9px}

/* ============================================================
   MULLIGANS — one line, because it shouldn't slow the card down
   ============================================================ */
.mull{display:flex;align-items:center;gap:11px}
.mtext{flex:1;min-width:0}
.mtext b{display:block;font-size:15px;line-height:1.2}
.mtext span{font-size:12px;color:var(--dim)}
#mullpanel button{width:42px;height:42px;border:1px solid var(--rule);
  background:#FBFCFB;font-size:20px;cursor:pointer;color:var(--ink);
  line-height:1;padding:0;flex:none}
#mullpanel button:active{background:var(--field)}
.mcount{font-family:var(--data);font-size:20px;font-weight:600;min-width:26px;
  text-align:center;flex:none}
.mover{font-size:12px;color:var(--warn);margin-top:9px}

/* ============================================================
   PHOTO
   ============================================================ */
.drop{border:1px dashed var(--rule);padding:20px;text-align:center;cursor:pointer;
  display:block;background:#FBFCFB}
.drop:hover{border-color:var(--green)}
.drop .big{font-size:21px;color:var(--dim)}
.drop b{display:block;font-size:15px;margin-top:5px}
.drop span{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shot{display:none;align-items:center;gap:12px}
.shot img{width:62px;height:62px;object-fit:cover;flex:none;border:1px solid var(--rule)}
.shot .info{flex:1;min-width:0;font-size:13px}
.shot .info b{display:block}
.shot .info span{color:var(--dim);font-size:11px}
.shot button{background:none;border:1px solid var(--rule);padding:7px 11px;
  font-size:12px;cursor:pointer;color:var(--dim)}
.has .drop{display:none}
.has .shot{display:flex}

/* ============================================================
   THE QR — the opponent scans it on their own phone, so the
   confirmation is theirs rather than something typed on ours
   ============================================================ */
.qrwrap{background:var(--card);border:1px solid var(--rule);padding:22px 18px;
  text-align:center;margin-bottom:18px}
.qrwrap canvas,.qrwrap img{width:100%;max-width:250px;height:auto;display:block;
  margin:0 auto 14px;image-rendering:pixelated}
.qrwrap .cap{font-size:14px;line-height:1.5;color:var(--dim)}
.qrwrap .cap b{color:var(--ink)}
.qrfail{font-size:13px;color:var(--dim);line-height:1.5}
.qrfail code{display:block;background:#F2F4F2;padding:10px;margin-top:9px;
  font-family:var(--data);font-size:11px;word-break:break-all}

.fallback{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.fallback > button{background:none;border:0;padding:0;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--green);font-weight:600;
  text-decoration:underline;text-underline-offset:3px}
.fallback .body{display:none;margin-top:16px}
.fallback.on .body{display:block}
.warnbox{background:#FDF3E7;border-left:4px solid #B45309;padding:12px 14px;
  font-size:13px;line-height:1.5;color:#7A4A10;margin-bottom:16px}

/* ============================================================
   HANDING OVER — the other team signs on your phone
   ============================================================ */
.hand{padding:20px 16px 40px}
.hand .lede{font-size:15px;color:var(--dim);line-height:1.5;margin:0 0 18px}
.hand .lede b{color:var(--ink)}
.who-list{display:grid;gap:8px;margin-bottom:20px}
.who-list button{
  background:var(--card);border:1px solid var(--rule);padding:15px 16px;
  text-align:left;cursor:pointer;font-size:16px;font-weight:500;color:var(--ink);
}
.who-list button[aria-pressed="true"]{
  border-color:var(--green);background:#F3F9F1;
  box-shadow:inset 0 0 0 1px var(--green);
}
.who-list button span{display:block;font-size:11px;color:var(--dim);
  font-family:var(--data);letter-spacing:.06em;margin-top:2px}

.sigwrap{display:none}
.sigwrap.on{display:block}
.sigbox{background:var(--card);border:1px solid var(--rule);position:relative;
  touch-action:none}
.sigbox canvas{display:block;width:100%;height:180px;cursor:crosshair}
.sigline{position:absolute;left:20px;right:20px;bottom:38px;
  border-bottom:1px solid var(--rule);pointer-events:none}
.sighint{position:absolute;left:20px;bottom:16px;font-size:12px;color:var(--dim);
  pointer-events:none}
.sigbox.drawn .sighint{display:none}
.sigacts{display:flex;gap:9px;margin-top:11px;align-items:center}
.sigacts .clear{background:none;border:1px solid var(--rule);padding:9px 14px;
  font-size:13px;cursor:pointer;color:var(--dim)}
.sigacts .note{flex:1;font-size:12px;color:var(--dim);line-height:1.4}
.sigacts .note.err{color:var(--warn)}
.sigacts .sign{background:var(--green);color:#fff;border:0;padding:13px 20px;
  font-size:15px;font-weight:600;cursor:pointer}
.sigacts .sign:disabled{opacity:.4;cursor:default}

.later{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--dim);line-height:1.5}
.later a{color:var(--green);font-weight:600}

/* ============================================================
   STICKY BAR
   ============================================================ */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--green-deep);color:#fff;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(0,0,0,.16);z-index:20}
.bar .shell{display:flex;align-items:center;gap:14px}
.total{flex:none;font-family:var(--data);line-height:1.1}
.total b{display:block;font-size:26px;font-weight:600;letter-spacing:-.04em}
.total span{font-size:8px;letter-spacing:.13em;color:rgba(255,255,255,.55)}
.gap{flex:1;font-size:11px;color:rgba(255,255,255,.62);line-height:1.35}
.gap.err{color:#FFB4B4}
.send{flex:none;background:var(--lime);color:var(--green-deep);border:0;
  padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer}
.send:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.4);cursor:default}

.state{padding:44px 18px;text-align:center;background:var(--card);margin-top:1px}
.state .tick{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  margin:0 auto 15px;font-size:24px;color:#fff;background:var(--green)}
.state h2{font-size:21px;margin-bottom:9px}
.state p{margin:0 auto;color:var(--dim);font-size:14px;max-width:38ch;line-height:1.5}
.state a{display:inline-block;margin-top:17px;background:var(--green);color:#fff;
  text-decoration:none;padding:11px 18px;font-size:14px;font-weight:600}
body.sent .holes,body.sent .panel,body.sent .bar{display:none}

.pick{padding:20px 16px}
.pick a{display:block;background:var(--card);border:1px solid var(--rule);
  padding:14px 16px;margin-bottom:9px;text-decoration:none;color:inherit}
.pick a:hover{border-color:var(--green)}
.pick b{display:block;font-size:16px}
.pick span{font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<div class="shell">
  <div id="loading" class="state"><p>Loading your card…</p></div>
  <div id="app" hidden></div>
</div>

<script type="module">
import { supabase, requireAuth, me } from './assets/db.js';
import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const params = new URLSearchParams(location.search);
let profile, match, course, team, partner, round, roster = [];
let gross = Array(9).fill(null);
let photoPath = null;
let scoring = { '-2':3, '-1':2, '0':1, '1':0 };
let strokeFrom = 'hardest';
let needSignoff = false;
let mulliganLimit = null;
let mulligans = 0;
let saveTimer = null;

/* ------------------------------------------------------------
   Boot
------------------------------------------------------------ */
(async () => {
  const session = await requireAuth();
  if (!session) return;

  profile = await me();
  if (!profile)          return fail('Could not load your profile.');
  if (!profile.team_id)  return fail('You\u2019re not on a team yet.',
                                     '<a href="login.html">Claim your spot</a>');

  const { data: cfg } = await supabase.from('league_settings').select('*').maybeSingle();
  if (cfg) {
    scoring = cfg.scoring || scoring;
    strokeFrom = cfg.stroke_from || 'hardest';
    needSignoff = !!cfg.require_signoff;
    mulliganLimit = cfg.mulligans_allowed ?? null;
  }

  const matchId = params.get('match');
  if (!matchId) return pickMatch();

  await loadMatch(matchId);
})();

function fail(msg, extra = '') {
  $('loading').innerHTML =
    `<div class="tick" style="background:#B91C1C">!</div>
     <h2>Can't do that</h2><p>${esc(msg)}</p>${extra}`;
}

/* If the QR didn't carry a match, offer the ones this team can enter. */
async function pickMatch() {
  const { data } = await supabase
    .from('matches')
    .select('id,week,played_on,bay,home_team,away_team,courses(name,nine)')
    .or(`home_team.eq.${profile.team_id},away_team.eq.${profile.team_id}`)
    .order('played_on', { ascending: false })
    .limit(6);

  if (!data || !data.length) {
    return fail('No rounds scheduled for your team yet.',
                '<a href="index.html">Back to the league</a>');
  }

  $('loading').hidden = true;
  $('app').hidden = false;
  $('app').innerHTML = `
    <div class="top"><div class="crumb">${esc(profile.team_name)}</div>
      <h1 style="font-size:24px;margin-top:10px">Which round?</h1></div>
    <div class="pick">${data.map(m => `
      <a href="?match=${m.id}">
        <b>Week ${m.week}${m.bay ? ' · Bay ' + m.bay : ''}</b>
        <span>${new Date(m.played_on).toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}
          · ${esc(m.courses?.name || '')} ${esc(m.courses?.nine || '')}</span>
      </a>`).join('')}
    </div>`;
}

async function loadMatch(id) {
  const [{ data: m, error }, { data: mates }] = await Promise.all([
    supabase.from('matches')
      .select('*,courses(*)')
      .eq('id', id).maybeSingle(),
    supabase.from('profiles')
      .select('id,full_name').eq('team_id', profile.team_id)
  ]);

  if (error || !m) return fail('That round doesn\u2019t exist.');
  if (![m.home_team, m.away_team].includes(profile.team_id))
    return fail('Your team isn\u2019t in that bay.');

  match  = m;
  course = m.courses;
  roster = mates || [];

  const otherId = m.home_team === profile.team_id ? m.away_team : m.home_team;

  const [{ data: t }, { data: p }, { data: r }] = await Promise.all([
    supabase.from('teams').select('*').eq('id', profile.team_id).single(),
    otherId ? supabase.from('teams').select('name,crest,accent').eq('id', otherId).maybeSingle()
            : Promise.resolve({ data:null }),
    supabase.from('rounds').select('*').eq('match_id', id).eq('team_id', profile.team_id).maybeSingle()
  ]);

  team = t; partner = p; round = r;

  if (round?.status === 'confirmed')
    return done('Already signed off',
      `Your ${roundPoints()} points are on the leaderboard. Nothing else to do.`);
  if (round?.status === 'submitted')
    return done('Already in',
      partner ? `Waiting on ${partner.name} to sign it off.` : 'Waiting on sign-off.');

  /* pick up wherever we left off: the draft in the database,
     or whatever's cached locally if the phone lost signal */
  if (round?.gross) gross = round.gross.slice();
  if (round?.mulligans) mulligans = round.mulligans;

  const cached = localStorage.getItem(cacheKey());
  if (cached && !round?.gross) {
    try {
      const c = JSON.parse(cached);
      if (c.gross) gross = c.gross;
      if (c.mulligans != null) mulligans = c.mulligans;

    } catch {}
  }

  render();
}

const cacheKey = () => `kgl-card-${match.id}-${profile.team_id}`;

/* ------------------------------------------------------------
   Scoring, mirroring the database function
------------------------------------------------------------ */
function strokesOn(i) {
  const h = team.handicap || 0;
  if (!h) return 0;
  const si = course.stroke_index[i];
  const idx = strokeFrom === 'easiest' ? 10 - si : si;
  const n = Math.floor(Math.abs(h)/9) + (idx <= Math.abs(h) % 9 ? 1 : 0);
  return Math.sign(h) * n;
}

function pointsFor(i) {
  if (gross[i] == null) return null;
  let diff = (gross[i] + strokesOn(i)) - course.pars[i];
  const keys = Object.keys(scoring).map(Number).sort((a,b) => a-b);
  diff = Math.max(keys[0], Math.min(keys[keys.length-1], diff));
  return scoring[String(diff)];
}

const roundPoints = () =>
  gross.reduce((a,g,i) => a + (g == null ? 0 : pointsFor(i)), 0);

/* ------------------------------------------------------------
   Render
------------------------------------------------------------ */
function render() {
  document.documentElement.style.setProperty('--accent', team.accent);

  const holes = course.pars.map((par,i) => {
    const st = strokesOn(i);
    /* six numbers, centred on par: eagle through triple */
    const opts = [];
    for (let d = -2; d <= 3; d++) opts.push(par + d);
    return `
    <div class="hole" data-h="${i}">
      <div class="hrow">
        <span class="hno">${i+1}</span>
        <span class="hpar">PAR ${par}</span>
        ${st ? `<span class="stroke"><i></i>${st > 0 ? '+' : ''}${st}</span>` : ''}
        <span class="pill" id="p${i}">–</span>
      </div>
      <div class="nums" role="group" aria-label="Score for hole ${i+1}">
        ${opts.map(v => `
          <button type="button" data-v="${v}"
            class="${v === par ? 'par' : ''}${v <= par-2 ? ' eag' : ''}"
            aria-pressed="false" aria-label="${v}">${v > 0 ? v : ''}</button>`).join('')}
      </div>
    </div>`;
  }).join('');

  $('loading').hidden = true;
  $('app').hidden = false;
  $('app').innerHTML = `
  <div class="top">
    <div class="crumb">Week ${match.week} · ${new Date(match.played_on)
      .toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}</div>
    <div class="bayline">
      ${match.bay ? `<div class="bay"><b>${match.bay}</b><span>BAY</span></div>` : ''}
      <div class="course">
        <b>${esc(course.name)}</b>
        ${esc(course.nine)} 9 · par ${course.pars.reduce((a,b)=>a+b,0)}${
          team.handicap ? ` · your handicap ${team.handicap > 0 ? '+' : ''}${team.handicap}` : ''}
      </div>
    </div>
    <div class="side">
      <div class="tile" style="background:${team.accent}">${esc(team.crest)}</div>
      <span><b>${esc(team.name)}</b> — your card</span>
      ${partner ? `<span style="margin-left:auto;text-align:right">
        signed off by <b>${esc(partner.name)}</b></span>` : ''}
    </div>
  </div>

  <div class="holes" id="holes">${holes}</div>

  <div class="panel" id="mullpanel">
    <div class="mull">
      <div class="mtext">
        <b>Mulligans used</b>
        <span>${
          mulliganLimit === 0 ? 'None are meant to be used, but say so if you did.'
          : mulliganLimit ? `${mulliganLimit} allowed.`
          : 'If you took any.'
        }</span>
      </div>
      <button type="button" id="mdown" aria-label="One fewer">−</button>
      <span class="mcount" id="mcount">${mulligans}</span>
      <button type="button" id="mup" aria-label="One more">+</button>
    </div>
    <div class="mover" id="mover"></div>
  </div>

  <div class="panel" id="photo">
    <h2>Photo of the screen</h2>
    <label class="drop">
      <span class="big">▣</span>
      <b>Take a photo</b>
      <span>Required. It's what Chris checks against if a card is queried.</span>
      <input type="file" id="shot" accept="image/*" capture="environment">
    </label>
    <div class="shot">
      <img id="thumb" alt="Scorecard photo">
      <div class="info"><b>Attached</b><span id="fname"></span></div>
      <button type="button" id="redo">Retake</button>
    </div>
  </div>

  <div class="bar">
    <div class="shell">
      <div class="total"><b id="pts">—</b><span>POINTS</span></div>
      <div class="gap" id="gap">Tap a number on each hole</div>
      <button class="send" id="send" disabled>Submit</button>
    </div>
  </div>`;

  wire();
  gross.forEach((_,i) => paint(i));
  tally();
}

function wire() {
  $('holes').querySelectorAll('.hole').forEach(row => {
    const i = +row.dataset.h;
    row.querySelectorAll('.nums button').forEach(b =>
      b.addEventListener('click', () => {
        const v = +b.dataset.v;
        const wasEmpty = gross[i] == null;
        gross[i] = gross[i] === v ? null : v;   // tap again to clear
        paint(i); tally(); queueSave();
        if (gross[i] != null) {
          if (gross[i] < course.pars[i]) cheer(row, b);
          if (wasEmpty) nudgeNext(i);
        }
      }));
  });

  $('mdown').addEventListener('click', () => bumpMulligans(-1));
  $('mup').addEventListener('click',   () => bumpMulligans(1));

  $('shot').addEventListener('change', onPhoto);
  $('redo').addEventListener('click', () => {
    $('photo').classList.remove('has');
    $('shot').value = ''; photoPath = null; tally();
  });
  $('send').addEventListener('click', submit);
}

/* Under par gets a quick pop, and a run of them says so. The
   run only counts holes you've actually entered, so it appears
   as you build it rather than after the fact. */
function cheer(row, btn) {
  btn.classList.remove('cheer');
  void btn.offsetWidth;                 // restart the animation
  btn.classList.add('cheer');
  row.classList.remove('cheer');
  void row.offsetWidth;
  row.classList.add('cheer');

  const i = +row.dataset.h;
  let run = 0;
  for (let j = i; j >= 0; j--) {
    if (gross[j] != null && gross[j] < course.pars[j]) run++; else break;
  }

  document.querySelectorAll('.streak').forEach(el => el.remove());
  if (run >= 2) {
    const tag = document.createElement('span');
    tag.className = 'streak';
    tag.textContent = run >= 4 ? `${run} IN A ROW — STOP IT`
                    : run === 3 ? 'THREE IN A ROW'
                    : 'TWO IN A ROW';
    row.querySelector('.hrow').insertBefore(tag, row.querySelector('.pill'));
  }
}

function bumpMulligans(d) {
  mulligans = Math.max(0, Math.min(20, mulligans + d));
  $('mcount').textContent = mulligans;
  $('mover').textContent =
    (mulliganLimit != null && mulligans > mulliganLimit)
      ? (mulliganLimit === 0
          ? `${mulligans} more than the league gives out. Chris will see it.`
          : `${mulligans - mulliganLimit} over the ${mulliganLimit} allowed.`)
      : '';
  queueSave();
}

/* scroll the next unfilled hole into view — keeps a thumb moving
   down the card without hunting */
function nudgeNext(i) {
  const next = gross.findIndex((g,j) => j > i && g == null);
  if (next < 0) return;
  const el = $('holes').querySelector(`[data-h="${next}"]`);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function paint(i) {
  const row = $('holes').querySelector(`[data-h="${i}"]`);
  if (!row) return;
  row.querySelectorAll('.nums button').forEach(b =>
    b.setAttribute('aria-pressed', +b.dataset.v === gross[i]));
  const pill = $('p'+i);
  const pt = pointsFor(i);
  pill.textContent = pt == null ? '–' : pt;
  pill.className = 'pill' + (pt == null ? '' : ' p'+pt);
}

function tally() {
  const done = gross.filter(g => g != null).length;
  $('pts').textContent = done ? roundPoints() : '—';

  const hasPhoto = $('photo').classList.contains('has');
  const ready = done === 9 && hasPhoto;
  $('send').disabled = !ready;
  $('gap').className = 'gap';
  $('gap').textContent =
    done < 9      ? `${9-done} hole${done===8?'':'s'} to go` :
    !hasPhoto     ? 'Photo needed before you can submit' :
    !needSignoff  ? 'Straight onto the leaderboard' :
    partner       ? `Goes to ${partner.name} to sign off` :
                    'Goes to Chris to sign off';
}

/* ------------------------------------------------------------
   Saving — locally on every tap, to the database a moment later
------------------------------------------------------------ */
function queueSave() {
  try {
    localStorage.setItem(cacheKey(), JSON.stringify({ gross, mulligans }));
  } catch {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 1500);
}

async function saveDraft() {
  const row = {
    match_id: match.id,
    team_id: profile.team_id,
    gross: gross.some(g => g == null) ? null : gross,
    mulligans,
    status: 'draft'
  };
  if (round?.id) {
    await supabase.from('rounds').update(row).eq('id', round.id);
  } else {
    const { data } = await supabase.from('rounds').insert(row).select().maybeSingle();
    if (data) round = data;
  }
}

/* ------------------------------------------------------------
   Photo
------------------------------------------------------------ */
function shrink(file, max = 1400) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not read that photo')),
               'image/jpeg', 0.82);
    };
    img.onerror = () => reject(new Error('Could not read that photo'));
    img.src = URL.createObjectURL(file);
  });
}

async function onPhoto(e) {
  const f = e.target.files[0];
  if (!f) return;
  $('gap').textContent = 'Shrinking the photo…';

  let blob;
  try { blob = await shrink(f); }
  catch (err) { $('gap').textContent = err.message; $('gap').className = 'gap err'; return; }

  $('thumb').src = URL.createObjectURL(blob);
  $('fname').textContent = Math.round(blob.size/1024) + ' KB';
  $('photo').classList.add('has');
  $('gap').textContent = 'Uploading…';

  if (!round?.id) await saveDraft();

  /* team id first, matching the storage policy and the other
     buckets. Week and match stay in the path so a season can be
     pulled out of the archive later. */
  const path = `${profile.team_id}/w${match.week}/${match.id}/${Date.now()}.jpg`;
  const { error } = await supabase.storage.from('scorecards')
    .upload(path, blob, { upsert: true, contentType: 'image/jpeg' });

  if (error) {
    $('gap').textContent = 'Upload failed: ' + error.message;
    $('gap').className = 'gap err';
    $('photo').classList.remove('has');
    return;
  }

  await supabase.from('round_photos').insert({
    round_id: round.id, storage_path: path,
    uploaded_by: profile.id, bytes: blob.size
  });

  photoPath = path;
  tally();
}

/* ------------------------------------------------------------
   Submit
------------------------------------------------------------ */
async function submit() {
  $('send').disabled = true;
  $('gap').textContent = 'Sending…';
  $('gap').className = 'gap';

  clearTimeout(saveTimer);
  await saveDraft();

  const { error } = await supabase.from('rounds')
    .update({ gross, mulligans, status: 'submitted' })
    .eq('id', round.id);

  if (error) {
    $('send').disabled = false;
    $('gap').textContent = error.message;
    $('gap').className = 'gap err';
    return;
  }

  try { localStorage.removeItem(cacheKey()); } catch {}

  /* When the league doesn't require the other team to sign,
     the database confirms it on submit and there's nothing
     left to chase. */
  if (!needSignoff) return finished();

  await handOver();
}

function finished() {
  document.body.classList.add('sent');
  window.scrollTo(0,0);
  $('app').innerHTML = `
    <div class="state">
      <div class="tick">✓</div>
      <h2>That's your card in</h2>
      <p>${roundPoints()} points, on the leaderboard now. Chris sees everything
         and will pick up anything that looks off.</p>
      <a href="contests.html?match=${match.id}">Record the contests</a>
      <p style="margin-top:16px;font-size:13px">
        <a href="index.html" style="color:var(--green)">Back to the league</a></p>
    </div>`;
}

/* ------------------------------------------------------------
   Hand the phone over
   The other team picks their name and signs with a finger. It
   isn't an authenticated confirmation — it's a named person
   putting their mark next to the photo, which is what the paper
   card was.
------------------------------------------------------------ */
let signer = null, sigDirty = false;

async function handOver() {
  const { data: signers } = await supabase.rpc('signers_for', { p_round: round.id });
  const list = signers || [];

  document.body.classList.add('sent');
  window.scrollTo(0,0);

  const url = new URL(`verify.html?round=${round.id}`, location.href).href;

  $('app').innerHTML = `
  <div class="top">
    <div class="crumb">${roundPoints()} points · submitted</div>
    <h1 style="font-size:26px;margin-top:10px">Get it signed</h1>
    <p style="margin:11px 0 0;font-size:14px;color:rgba(255,255,255,.8);line-height:1.5">
      ${partner
        ? `Someone from <b style="color:#fff">${esc(partner.name)}</b> confirms the
           numbers match the screen.`
        : `Nobody else in your bay, so Chris confirms this one.`}
    </p>
  </div>

  <div class="hand">
    <div class="qrwrap">
      <div id="qrslot"></div>
      <p class="cap">
        <b>Have them scan this with their phone.</b><br>
        It opens the card on their own device, signed in as them.
        One tap and it's done.
      </p>
    </div>

    <div class="fallback" id="fallback">
      <button type="button" id="showfb">They don't have their phone</button>
      <div class="body">
        <div class="warnbox">
          A signature on your phone can't prove who made it, so it counts for less
          than them confirming on their own. Chris can see which cards were signed
          this way. Use the code above if there's any chance of it.
        </div>
        ${list.length ? `
        <p class="lede">Who's signing?</p>
        <div class="who-list" id="wholist">
          ${list.map(p => `
            <button type="button" data-n="${esc(p.name)}" aria-pressed="false">
              ${esc(p.name)}<span>${p.role === 'commissioner' ? 'COMMISSIONER' : 'OPPONENT'}</span>
            </button>`).join('')}
        </div>

        <div class="sigwrap" id="sigwrap">
          <p class="lede" id="sigfor"></p>
          <div class="sigbox" id="sigbox">
            <canvas id="sig"></canvas>
            <div class="sigline"></div>
            <div class="sighint">Sign here</div>
          </div>
          <div class="sigacts">
            <button type="button" class="clear" id="sigclear">Clear</button>
            <span class="note" id="signote">Signing says the card matches the screen.</span>
            <button type="button" class="sign" id="dosign" disabled>Sign</button>
          </div>
        </div>`
        : `<p class="lede">Nobody's listed to sign yet.</p>`}
      </div>
    </div>

    <div class="later" style="margin-top:16px;padding-top:16px">
      <a href="contests.html?match=${match.id}"
         style="display:inline-block;background:var(--green);color:#fff;
                text-decoration:none;padding:12px 18px;font-size:14px;font-weight:600">
        Record the contests
      </a>
      <div style="margin-top:9px">Closest to the pin, long putt, chip-ins.</div>
    </div>

    <div class="later">
      No rush — the card stays submitted either way, and
      ${partner ? esc(partner.name) + ' can confirm it' : 'Chris can confirm it'}
      later from their own phone.
      <a href="index.html">Back to the league</a>
    </div>
  </div>`;

  paintQR(url);

  $('showfb').addEventListener('click', () => {
    $('fallback').classList.add('on');
    $('showfb').style.display = 'none';
    wireSignature();
  });
}

async function paintQR(url) {
  const slot = $('qrslot');
  try {
    const cv = document.createElement('canvas');
    await QRCode.toCanvas(cv, url, {
      width: 500, margin: 1,
      color: { dark: '#10221A', light: '#FFFFFF' }
    });
    slot.appendChild(cv);
  } catch {
    /* offline or the CDN is unreachable — the link still works */
    slot.innerHTML =
      `<p class="qrfail">Couldn't draw the code. They can open this instead:
       <code>${esc(url)}</code></p>`;
  }
}

function wireSignature() {
  const list = $('wholist');
  if (!list) return;

  list.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => {
      signer = b.dataset.n;
      list.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', x === b));
      $('sigfor').innerHTML = `<b>${esc(signer)}</b>, sign below.`;
      $('sigwrap').classList.add('on');
      $('sigwrap').scrollIntoView({ behavior:'smooth', block:'nearest' });
      sizeCanvas();
    }));

  const cv = $('sig');
  const ctx = cv.getContext('2d');
  let drawing = false;

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    cv.width = r.width * dpr;
    cv.height = r.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#10221A';
  }

  const pos = e => {
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };

  const start = e => {
    e.preventDefault();
    drawing = true;
    const { x, y } = pos(e);
    ctx.beginPath(); ctx.moveTo(x, y);
  };
  const move = e => {
    if (!drawing) return;
    e.preventDefault();
    const { x, y } = pos(e);
    ctx.lineTo(x, y); ctx.stroke();
    if (!sigDirty) {
      sigDirty = true;
      $('sigbox').classList.add('drawn');
      $('dosign').disabled = false;
    }
  };
  const end = () => { drawing = false; };

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);

  $('sigclear').addEventListener('click', () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    sigDirty = false;
    $('sigbox').classList.remove('drawn');
    $('dosign').disabled = true;
  });

  $('dosign').addEventListener('click', () => sign(cv));
  window.addEventListener('resize', () => { if (signer) sizeCanvas(); });
}

async function sign(cv) {
  const note = $('signote'), btn = $('dosign');
  btn.disabled = true;
  note.textContent = 'Saving…'; note.className = 'note';

  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const path = `${round.id}/${Date.now()}.png`;

  const up = await supabase.storage.from('signatures')
    .upload(path, blob, { contentType: 'image/png', upsert: true });

  if (up.error) {
    btn.disabled = false;
    note.textContent = up.error.message; note.className = 'note err';
    return;
  }

  const { error } = await supabase.rpc('attest_in_person', {
    p_round: round.id, p_name: signer, p_signature: path
  });

  if (error) {
    btn.disabled = false;
    note.textContent = error.message; note.className = 'note err';
    return;
  }

  $('app').innerHTML = `
    <div class="state">
      <div class="tick">✓</div>
      <h2>Signed and done</h2>
      <p>${esc(signer)} signed it. Your ${roundPoints()} points are on the
         leaderboard. Nothing else to do tonight.</p>
      <a href="index.html">Back to the league</a>
    </div>`;
  window.scrollTo(0,0);
}

function done(title, body) {
  document.body.classList.add('sent');
  $('loading').hidden = true;
  $('app').hidden = false;
  $('app').innerHTML = `
    <div class="state">
      <div class="tick">✓</div>
      <h2>${esc(title)}</h2><p>${esc(body)}</p>
      ${round?.id && partner
        ? `<a href="verify.html?round=${round.id}">Sign it off now</a>`
        : `<a href="index.html">Back to the league</a>`}
    </div>`;
  window.scrollTo(0,0);
}
</script>
</body>
</html>
